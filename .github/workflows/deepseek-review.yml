name: Optional DeepSeek V4 Pro Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: write
  contents: read

jobs:
  code-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Fork pull requests cannot access DEEPSEEK_API_KEY. The required, secret-free
    # CI workflow still runs for external contributors.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: DeepSeek V4 Pro Review
        uses: AleksandrFurmenkovOfficial/ai-code-review@1d75404db7d56026c81700b5b8e5e8c613234e69 # v1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          pr_number: ${{ github.event.number }}

          ai_provider: 'deepseek'
          deepseek_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
          deepseek_model: 'deepseek-v4-pro'

          exclude_paths: 'node_modules/,dist/,build/,coverage/'
          exclude_extensions: '.lock,.min.js,.min.css,.map'
          fail_action_if_review_failed: 'false'
