name: 功能建议
description: 建议新的工程能力、策略研究入口或文档改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请先描述用户问题，而不是直接给出实现方案。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明预期输入、输出、边界和替代方案。
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: 验证方式
      description: 如何使用离线测试、公开平台或合成数据证明改动有效？
    validations:
      required: true

  - type: textarea
    id: sources
    attributes:
      label: 数据与来源
      description: 如涉及数据、第三方代码或策略思想，请提供来源和许可证信息。
